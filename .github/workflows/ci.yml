name: Transaction Foundation Model QA

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      test_image:
        description: "blueprint-github-test image (dataset download)"
        required: false
        default: nvcr.io/rw983xdqtcdp/auto_test_team/blueprint-github-test-image:latest

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-notebooks:
    runs-on: arc-runners-org-nvidia-ai-bp-1-gpu
    timeout-minutes: 120
    env:
      NEMO_IMAGE: nvcr.io/nvidia/nemo:25.09.01
      TEST_IMAGE: ${{ inputs.test_image || 'nvcr.io/rw983xdqtcdp/auto_test_team/blueprint-github-test-image:latest' }}
      CELL_TIMEOUT: "900"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Docker Login
        env:
          TEST_DOCKER_PULL_KEY: ${{ secrets.TEST_DOCKER_PULL_KEY }}
        run: |
          if [ -z "${TEST_DOCKER_PULL_KEY}" ]; then
            echo "::error::secret TEST_DOCKER_PULL_KEY is not set"
            exit 1
          fi
          echo "${TEST_DOCKER_PULL_KEY}" | docker login nvcr.io --username '$oauthtoken' --password-stdin
          docker version

      - name: Get System Info
        run: |
          more /etc/os-release
          nvidia-smi || echo "nvidia-smi not available on the host"

      - name: Download Data File Using Docker
        run: |
          docker rm -f tfm_data_downloader 2>/dev/null || true
          docker run --name tfm_data_downloader "${TEST_IMAGE}" \
            python3 utils/financial_fraud_detection_download_box_file.py
          mkdir -p data/TabFormer/raw
          docker cp tfm_data_downloader:/app/downloads/extracted/credit_card/transactions.tgz data/TabFormer/transactions.tgz
          docker rm tfm_data_downloader
          ls -lh data/TabFormer/transactions.tgz

      - name: Pull NeMo container
        run: docker pull "${NEMO_IMAGE}"

      - name: Run notebooks 01-05 in the NeMo container
        run: |
          mkdir -p results
          docker run --rm --gpus all --shm-size=8g --ulimit memlock=-1 \
            -e CELL_TIMEOUT \
            -v "$(pwd):/workspace" -w /workspace \
            "${NEMO_IMAGE}" \
            bash -c '
              set -euo pipefail
              nvidia-smi
              git config --global --add safe.directory /workspace
              apt-get update && apt-get install -y git-lfs
              git lfs install
              git lfs pull
              ls -lh models/decoder-foundation-model/
              python -m pip install -q papermill
              for nb in 01_dataset_baseline 02_seq_preproc_tokenization 03_foundation_model_training \
                        04_inference_embedding_extraction 05_xgboost_fraud_detection; do
                echo "===================== ${nb} ====================="
                papermill "${nb}.ipynb" "results/${nb}.ipynb" --kernel python3 \
                  --execution-timeout "${CELL_TIMEOUT}" --log-output --log-level INFO
              done
            '

      - name: Convert result notebooks to HTML
        if: always()
        run: |
          if ! ls results/*.ipynb >/dev/null 2>&1; then
            echo "::error::no executed notebook in results/"
            exit 1
          fi
          docker run --rm -v "$(pwd):/workspace" -w /workspace "${NEMO_IMAGE}" \
            bash -c 'jupyter nbconvert --to html results/*.ipynb && chmod -R a+rwX results data models || true'
          ls -lh results/

      - name: Upload the result notebooks as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transaction-foundation-model-notebooks
          path: |
            results/*.html
            results/*.ipynb
          retention-days: 30

      - name: Set result output
        id: set_result
        if: always()
        run: |
          echo "RESULT=$(if [ '${{ job.status }}' == 'success' ]; then echo 'PASS'; else echo 'FAIL'; fi)" >> "$GITHUB_OUTPUT"

      - name: Send mail
        uses: dawidd6/action-send-mail@6e71c855c9a091d80a519621b9fd3e8d252ca40c
        if: always()
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "QA Test Workflow Result for ${{ github.repository }}"
          to: Github-Action-Blueprint-QA@nvidia.com
          from: github-workflow-notification@gmail.com
          html_body: |
            <p>Hello,</p>
            <p>The workflow for repository: <strong>${{ github.repository }}</strong> has completed.<br>
            <strong>Result:</strong> ${{ steps.set_result.outputs.RESULT }}</p>
            <p>You can review the details on GitHub:<br>
            <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}</a></p>
            <p>Thanks!</p>
