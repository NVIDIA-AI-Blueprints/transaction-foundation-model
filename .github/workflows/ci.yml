name: Transaction Foundation Model QA

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      test_image:
        description: QA test image
        required: false
        default: nvcr.io/rw983xdqtcdp/auto_test_team/blueprint-github-test-image:latest

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-notebooks:
    runs-on: arc-runners-org-nvidia-ai-bp-1-gpu
    timeout-minutes: 120
    env:
      NEMO_IMAGE: nvcr.io/nvidia/nemo:25.09.01
      TEST_IMAGE: ${{ inputs.test_image || 'nvcr.io/rw983xdqtcdp/auto_test_team/blueprint-github-test-image:latest' }}
      NOTEBOOK_CONTAINER: tfm-notebooks-${{ github.run_id }}
      NOTEBOOKS: >-
        01_dataset_baseline
        02_seq_preproc_tokenization
        03_foundation_model_training
        04_inference_embedding_extraction
        05_xgboost_fraud_detection
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Get System Info
        run: |
          more /etc/os-release
          nvidia-smi

      - name: Docker Login
        env:
          NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
        run: |
          : "${NGC_API_KEY:?NGC_API_KEY secret missing}"
          echo "${NGC_API_KEY}" | docker login nvcr.io -u '$oauthtoken' --password-stdin
          docker pull "${NEMO_IMAGE}"

      - name: Start NeMo container
        run: |
          set -euo pipefail
          docker run -d --name "${NOTEBOOK_CONTAINER}" --gpus all --shm-size=8g --ulimit memlock=-1 \
            -v "$PWD:/workspace" -w /workspace "${NEMO_IMAGE}" sleep infinity
          docker exec "${NOTEBOOK_CONTAINER}" bash -c '
            set -euo pipefail
            nvidia-smi
            git config --global --add safe.directory /workspace
            apt-get update && apt-get install -y git-lfs
            git lfs install
            git lfs pull
            git lfs ls-files
            pip install papermill nbconvert
          '

      - name: Run notebooks with Papermill
        run: |
          set -euo pipefail
          mkdir -p output
          for nb in ${NOTEBOOKS}; do
            echo "===================== ${nb} ====================="
            docker exec "${NOTEBOOK_CONTAINER}" papermill "${nb}.ipynb" "output/${nb}.ipynb" --log-output --log-level INFO
          done

      - name: Convert results to html format
        if: always()
        run: |
          for nb in ${NOTEBOOKS}; do
            if [ -f "output/${nb}.ipynb" ]; then
              docker exec "${NOTEBOOK_CONTAINER}" jupyter nbconvert --to html "output/${nb}.ipynb"
            fi
          done
          ls -la output || true

      - name: Run Test Code
        if: always()
        env:
          TEST_DOCKER_PULL_KEY: ${{ secrets.TEST_DOCKER_PULL_KEY }}
        run: |
          set -euo pipefail
          : "${TEST_DOCKER_PULL_KEY:?TEST_DOCKER_PULL_KEY secret missing}"
          echo "${TEST_DOCKER_PULL_KEY}" | docker login nvcr.io --username '$oauthtoken' --password-stdin
          mounts=()
          for nb in ${NOTEBOOKS}; do
            if [ -f "output/${nb}.html" ]; then
              mounts+=(-v "$PWD/output/${nb}.html:/app/input/transaction_foundation_model/${nb}.html")
            else
              echo "Missing output/${nb}.html: its cases fail"
            fi
          done
          docker run --rm "${mounts[@]}" -v "$PWD:/workspace" "${TEST_IMAGE}" \
            pytest -m transaction_foundation_model --timeout=900 --disable-warnings \
            --html=/workspace/transaction-foundation-model.html --self-contained-html

      - name: Upload the result notebooks and pytest report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result notebooks and pytest
          path: |
            output/*.html
            transaction-foundation-model.html
          if-no-files-found: warn
          retention-days: 30

      - name: Cleanup
        if: always()
        run: |
          docker rm -f "${NOTEBOOK_CONTAINER}" 2>/dev/null || true

      - name: Set result output
        id: set_result
        if: always()
        run: |
          echo "RESULT=$(if [ '${{ job.status }}' == 'success' ]; then echo 'PASS'; else echo 'FAIL'; fi)" >> "$GITHUB_OUTPUT"

      - name: Send mail
        uses: dawidd6/action-send-mail@6e71c855c9a091d80a519621b9fd3e8d252ca40c
        if: always()
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "QA Test Workflow Result for ${{ github.repository }}"
          to: Github-Action-Blueprint-QA@nvidia.com
          from: github-workflow-notification@gmail.com
          html_body: |
            <p>Hello,</p>
            <p>The workflow for repository: <strong>${{ github.repository }}</strong> has completed.<br>
            <strong>Result:</strong> ${{ steps.set_result.outputs.RESULT }}</p>
            <p>You can review the details on GitHub:<br>
            <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}</a></p>
            <p>Thanks!</p>
